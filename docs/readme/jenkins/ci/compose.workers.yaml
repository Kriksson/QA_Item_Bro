# Each Surefire fork gets its own backend, frontend and PostgreSQL.
x-db: &db
  image: ${POSTGRES_IMAGE:-postgres:17-alpine}
  environment:
    POSTGRES_DB: item_bro
    POSTGRES_USER: ${DB_USER:-kriksson}
    POSTGRES_PASSWORD: ${DB_PASSWORD:-kriksson}
  tmpfs:
    - /var/lib/postgresql/data
  mem_limit: 256m
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 2s
    timeout: 3s
    retries: 30

x-app: &app
  image: ${APP_IMAGE:-item-bro-app:latest}
  mem_limit: 640m
  environment: &app-env
    SPRING_DATASOURCE_USERNAME: ${DB_USER:-kriksson}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-kriksson}
    JAVA_TOOL_OPTIONS: -Xms32m -Xmx384m
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
        printf "GET /csrf HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
        head -n 1 <&3 | grep -q " 200 "'
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 10s

x-frontend: &frontend
  image: ${FRONTEND_IMAGE:-item-bro-ui-frontend:latest}
  mem_limit: 128m
  environment: &frontend-env
    NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: '1'
  healthcheck:
    test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1/']
    interval: 2s
    timeout: 3s
    retries: 20

services:
  db-1:
    <<: *db
    profiles: [worker1]
    networks:
      default:
        aliases: ["${CI_PREFIX:-qa-item-bro-ci}-db-1"]
  app-1:
    <<: *app
    profiles: [worker1]
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CI_PREFIX:-qa-item-bro-ci}-db-1:5432/item_bro
    depends_on:
      db-1:
        condition: service_healthy
    networks:
      default:
        aliases: ["${CI_PREFIX:-qa-item-bro-ci}-app-1"]
  frontend-1:
    <<: *frontend
    profiles: [worker1]
    environment:
      <<: *frontend-env
      API_UPSTREAM: http://${CI_PREFIX:-qa-item-bro-ci}-app-1:8080
    depends_on:
      app-1:
        condition: service_healthy
    networks:
      default:
        aliases: ["${CI_PREFIX:-qa-item-bro-ci}-frontend-1"]

  db-2:
